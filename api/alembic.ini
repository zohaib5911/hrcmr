# Alembic configuration (plan.md T0.5). Migrations run as the `app_owner` role.
# The database URL is NEVER written here: alembic/env.py reads DATABASE_URL_OWNER from the
# environment (or an explicit URL passed by the CLI / tests).
[alembic]
script_location = %(here)s/alembic
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s
prepend_sys_path = .
path_separator = os
