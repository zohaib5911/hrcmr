[project]
name = "brand-api"
version = "0.1.0"
description = "UK HR and sponsor-compliance platform: FastAPI backend"
requires-python = ">=3.12,<3.13"
dependencies = [
    "aiosmtplib>=5.1.3",
    "alembic>=1.20.0",
    "argon2-cffi>=25.1.0",
    "arq>=0.25.0",
    "asyncpg>=0.32.0",
    "boto3>=1.43.114",
    "cryptography>=50.0.2",
    "email-validator>=2.3.0",
    "fastapi>=0.146.0",
    "gunicorn>=26.2.0",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "pydantic-settings>=2.16.0",
    "python-multipart>=0.0.32",
    "redis>=8.1.0",
    "sqlalchemy[asyncio]>=2.1.5",
    "structlog>=26.1.0",
    "uvicorn-worker>=0.4.0",
    "uvicorn[standard]>=0.54.0",
    "weasyprint>=70.0",
]

[tool.uv]
# An application, not a distributable library: no build backend, imports resolve from this folder.
package = false
# Supply-chain cooldown, the same rule as web/pnpm-workspace.yaml (minimumReleaseAge): a release
# younger than 14 days is not resolved, which gives the community time to catch a bad upload.
exclude-newer = "14 days"
# Exception: the certifi release that fixes PYSEC-2026-4320 (2026.10.18 or later) is younger than the
# window. A cooldown must never hold back a security fix. Remove this line after 2026-11-06, when the
# locked certifi (2026.10.23) is 14 days old and the cooldown covers it.
# Phase 6 pip-audit security fixes: brotli 1.2.1 (PYSEC-2026-4322), pypdf 6.21.4
# (CVE-2026-119203/119205/119204 and earlier fixes). Remove these two exceptions
# after 2026-11-05 (brotli) and 2026-11-12 (pypdf), once the releases clear the cooldown.
exclude-newer-package = { certifi = "2026-11-01T00:00:00Z", brotli = "2026-11-03T00:00:00Z", pypdf = "2026-11-03T00:00:00Z" }

[dependency-groups]
dev = [
    "asgi-lifespan>=2.1.0",
    "mypy>=2.4.0",
    "pypdf>=6.21.4",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff==0.17.1",
]

# ---------------------------------------------------------------------------------------------
# Quality gates (plan.md T0.4): ruff clean, mypy --strict clean, pytest green.
# ---------------------------------------------------------------------------------------------
[tool.ruff]
target-version = "py312"
line-length = 100
src = ["."]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "N", "UP", "B", "A", "C4", "DTZ", "T20", "SIM", "PT", "RUF",
    "S",      # flake8-bandit: hard-coded secrets, unsafe calls
    "ASYNC",  # blocking calls inside async code
    "PERF", "TC",
]
ignore = ["RUF012"]

[tool.ruff.lint.per-file-ignores]
# Tests may assert, and use obviously fake secret sentinels.
"**/tests/**" = ["S101", "S105", "S106", "TC001", "TC002", "TC003", "E501"]
"conftest.py" = ["S101", "S105", "S106", "TC001", "TC002", "TC003"]
# Alembic files are generated from a template; typing-only import placement is noise there.
"alembic/**" = ["TC001", "TC002", "TC003", "E501"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["app", "tests", "conftest.py", "gunicorn.conf.py"]
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["gunicorn.*", "uvicorn_worker.*", "boto3.*", "botocore.*", "weasyprint.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests", "app"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
markers = [
    "integration: needs the local Docker stack (Postgres, Redis); start it with `docker compose up -d --wait`",
]
filterwarnings = ["error"]
