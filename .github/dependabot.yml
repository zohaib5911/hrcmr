# Dependabot (plan.md T0.8): weekly update pull requests for everything this repository pins.
#
# cooldown: a release must be 14 days old before Dependabot proposes it, the same rule the
# lockfiles already enforce (web/pnpm-workspace.yaml `minimumReleaseAge`, api/pyproject.toml
# `exclude-newer`). Security updates are not delayed by the cooldown.
#
# Pull requests are grouped so one week produces one PR per ecosystem, not thirty. Each still has to
# pass the whole CI workflow, including the secret, vulnerability and static-analysis checks.
version: 2

updates:
  # --- Python (api/) ---------------------------------------------------------------------------
  - package-ecosystem: uv
    directory: /api
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 14
    groups:
      python-dependencies:
        patterns: ["*"]

  # --- JavaScript (web/, pnpm) -----------------------------------------------------------------
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 14
    groups:
      web-dependencies:
        patterns: ["*"]

  # --- Container base images (digest-pinned in the Dockerfiles) ----------------------------------
  - package-ecosystem: docker
    directories: [/api, /web]
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 14
    groups:
      container-base-images:
        patterns: ["*"]

  # --- Images used by the local stack and the CI services (docker-compose.yml) -------------------
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 14
    groups:
      compose-images:
        patterns: ["*"]

  # --- GitHub Actions used by the workflows (pinned to commit SHAs) ------------------------------
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 14
    groups:
      github-actions:
        patterns: ["*"]
